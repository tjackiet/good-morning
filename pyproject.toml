[project]
name = "good-morning"
version = "0.1.0"
description = "暗号資産投資向けモーニングレター生成ツール（マーケット数値・予定・ニュースを集約して Markdown に出力）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.0",
    "anthropic>=2.0,<3",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "mcp>=2.0,<3",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
good-morning = "good_morning.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/good_morning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
