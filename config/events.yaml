# 今後の予定の設定（FOMC・日銀の日程、FRED の経済指標、決算）
#
# FOMC と日銀の日程は、公式ページから年1回手で転記する。
#   FOMC: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   日銀: https://www.boj.or.jp/mopo/mpmsche_minu/index.htm
# 2026-11-17 に両ページから転記（FOMC の2027年は「各会合の直前の会合で確定するまでは暫定」）。

horizon:
  detail_days: 7    # 今日からこの日数以内は詳しく（日時・内容・重要度・予想値）
  total_days: 30    # 今日からこの日数以内を、残りは1行ずつの簡易一覧に出す

# 区分ごとの既定値。events の各項目で上書きできる。
# time を書かない予定は「時刻未定」として、その日の最後に並べる。
categories:
  fomc:
    timezone: America/New_York
    time: "14:00"          # 声明の発表（議長会見は 14:30）。公式ページに時刻の記載はなく、慣例の時刻
    importance: 高
  fomc_minutes:
    timezone: America/New_York
    time: "14:00"
    importance: 中         # 政策決定の3週間後に公開（公式ページの記載）
  boj:
    timezone: Asia/Tokyo
    importance: 高         # 結果の発表時刻は決まっていない（昼ごろが多い）。総裁会見は 15:30
    note: 時刻未定・例年は昼ごろ
  boj_opinions:
    timezone: Asia/Tokyo
    time: "08:50"
    importance: 低

# estimated: true … 公式ページに日付がなく、ルールから計算した日付（表では「推定」と出す）
events:
