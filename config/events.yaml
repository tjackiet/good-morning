# FRED の経済指標の発表予定日（fred/releases/dates、include_release_dates_with_no_data=true）。
# FRED が返すのは日付だけなので、発表時刻（米東部時間）と重要度はここで決める。
# name は FRED の release_name と完全一致させる。ここにない指標は表示しない。
# ※ FRED_API_KEY を設定してから、実データで name が一致するかを確かめること（未確認）。
fred:
  timezone: America/New_York
  releases:
    - {name: Employment Situation, title: 米雇用統計, importance: 高, time: "08:30"}
    - {name: Consumer Price Index, title: 米消費者物価指数（CPI）, importance: 高, time: "08:30"}
    - {name: Personal Income and Outlays, title: 米個人所得・個人消費支出（PCE）, importance: 高, time: "08:30"}
    - {name: Gross Domestic Product, title: 米GDP, importance: 中, time: "08:30"}
    - {name: Producer Price Index, title: 米生産者物価指数（PPI）, importance: 中, time: "08:30"}
    - {name: Advance Monthly Sales for Retail and Food Services, title: 米小売売上高, importance: 中, time: "08:30"}
    - {name: Job Openings and Labor Turnover Survey, title: 米JOLTS求人件数, importance: 中, time: "10:00"}
    - {name: Unemployment Insurance Weekly Claims Report, title: 米新規失業保険申請件数, importance: 低, time: "08:30"}

# 決算（ウォッチリストの米国株と、related に書いた関連企業）
earnings:
  importance:
    watchlist: 中
    related: 低
