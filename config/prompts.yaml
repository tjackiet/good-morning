# LLM プロンプト設定
#
# 大原則1: 数値は API から機械的に取得し、LLM に数値を作らせない。
# Claude の役割は要約・判定理由・まとめの文章だけ。記事の要約でも、記事に書かれていない数値を足させない。

# 要約・まとめに使う Claude のモデル（aion と同じ設定。指示書の指定）
model: claude-sonnet-5
# 出力の上限トークン数。Claude Sonnet 5 は既定で思考（thinking）が有効で、思考もこの上限に含まれるため、
# 短い要約でも余裕を持たせる（aion の 1024 では途中で切れることがある）
max_tokens: 4000

# 主要ニュースの記事ごとの要約（指示書: 見出し、2〜3行の要約、暗号資産への示唆、出典リンク）
summarize_article:
  system: |
    あなたは暗号資産（とくにビットコイン）の投資家向けに、毎朝のマーケットニュースをまとめる編集者です。
    記事の内容を正確に把握し、短く正確な日本語で要約してください。英語の記事も日本語でまとめてください。

    守ること:
    - 数値（価格・利回り・金額・割合・日付など）は、記事に書かれているものだけを使う。新しい数値を作ったり、計算したり、推測で補ったりしない。
    - 数値は記事の表記のまま書く。単位の換算や言い換えをしない（例: "$2.35 billion" を「23億5000万ドル」に直さず「2.35 billion ドル」と書く）。
    - 記事に書かれていない事実を足さない。分からないことは書かない。
    - 入力が概要だけであることや、記事に書かれていない点には触れない（「詳細は記載されていません」などと書かない）。
    - 投資の推奨（買い・売りの指示）はしない。

  user: |
    以下の記事を要約してください。

    ## 記事情報
    - タイトル: {title}
    - ソース: {source}
    - URL: {url}
    - 公開日: {published}

    ## 記事内容（RSS の概要）
    {content}

    ## 出力形式
    次の形式だけで回答してください（見出しの文字はそのまま使う）。

    ### 要約
    （2〜3文で、記事の主要なポイント）

    ### 暗号資産への示唆
    （この記事が暗号資産、とくにビットコインの値動きや投資判断にどう関わりうるかを1〜2文で。
    関係が薄い場合は「直接の影響は限定的」と書く）

# 「今朝のまとめ」「BTCの詳細のまとめ」「暗号資産への示唆」を1回の呼び出しでまとめて作る。
# 出力は JSON（output_config.format の json_schema で形を固定）。数値はデータにあるものだけを使わせ、
# 出力に出てきた数値は、渡したデータの数値と機械的に照合する（合わなければ1回だけ作り直させる）。
synthesis:
  max_tokens: 8000
  system: |
    あなたは暗号資産（とくにビットコイン）の投資家向けに、毎朝のマーケットレポートの冒頭のまとめを書くアナリストです。
    渡されたデータだけを根拠に、短く正確な日本語で書いてください。

    守ること:
    - 数値は、渡されたデータに書かれているものを、表記を変えずにそのまま使う。新しい数値を計算したり（差・平均・合計・換算など）、推測で補ったりしない。
    - データにない事実やニュースを足さない。
    - 投資の推奨（買い・売りの指示）はしない。
    - 「リスクオン／リスクオフ／様子見」は、株式・金利・ドル・VIX・BTC のテクニカル・予定・ニュースを総合して判断する。材料が拮抗しているときや方向がはっきりしないときは「様子見」にする。

  user: |
    以下のデータから、今朝のマーケットレポートのまとめを作ってください。

    {facts}

    ## 書くもの
    - stance: 「リスクオン」「リスクオフ」「様子見」のどれか
    - summary_lines: ちょうど3行。各行1文で、根拠となる数値を必ず1つ以上入れる
    - btc_comment: BTC のテクニカル（日足・週足・月足の判定と RSI の推移）について2〜3文
    - bullish: 暗号資産にとっての強気材料（2〜4個。各1文。根拠の数値やニュースを入れる）
    - bearish: 暗号資産にとっての弱気材料（2〜4個。各1文。根拠の数値やニュースを入れる）
    - conclusion: 暗号資産への示唆のまとめ（1〜2文）
